# namespace 預設 default
namespace: cdp-web
replicaCount: 2
nodePool: web

# deployment 設定
deployment:
  # 服務的名稱(必填)
  appName: staging-cdp-vue-frontend
  appVersion: cdp-v2
  container:
    containerPort: 80
  resources:
    request:
      memory: "250Mi"
      cpu: "50m"
    limits:
      memory: "500Mi"
      cpu: "100m"

# service 設定
service:
  name: cdp-inner-service
